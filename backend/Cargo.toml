[workspace]
resolver = "2"
members = [
    "trycode-backend",
    "trycode-core",
    "trycode-auth",
    "trycode-execution",
    "trycode-collab",
    "trycode-projects",
    "trycode-admin",
    "trycode-ai",
]

[workspace.dependencies]
# Core
tokio = { version = "1.39", features = ["full", "tracing"] }
axum = { version = "0.7", features = ["macros", "json", "multipart", "ws"] }
tower = { version = "0.4", features = ["util"] }
tower-http = { version = "0.6", features = ["cors", "trace", "fs", "limit"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_with = "3.5"
thiserror = "1.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter", "registry"] }
tracing-opentelemetry = "0.26"
opentelemetry = { version = "0.26", features = ["trace", "metrics"] }
opentelemetry-otlp = "0.26"
metrics = "0.21"
metrics-exporter-prometheus = "0.13"

# Database
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "json", "migrate"] }
sqlx-postgres = "0.7"
deadpool-postgres = { version = "0.14" }
tokio-postgres = "0.7"
redis = { version = "0.24", features = ["tokio-comp", "connection-manager", "streams", "script"] }
deadpool-redis = { version = "0.14" }

# Auth & Security
argon2 = "0.5"
jsonwebtoken = "9.2"
uuid = { version = "1.6", features = ["v4", "v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
rand = { version = "0.8", features = ["std"] }
base64 = { version = "0.21", features = ["std"] }
ring = "0.17"
aes-gcm = "0.10"
secrecy = "0.8"
zeroize = "1.6"

# Config
figment = { version = "0.10", features = ["toml", "env"] }
config = "0.13"

# HTTP Client
reqwest = { version = "0.12", features = ["json", "rustls-tls", "stream", "multipart", "cookies"] }

# Validation
validator = { version = "0.17", features = ["derive"] }

# Email
lettre = { version = "0.11", default-features = false, features = ["builder", "tokio1", "tokio1-rustls-tls", "smtp-transport"] }
tera = "1.19"

# CAPTCHA
async-trait = "0.1"

# OAuth
oauth2 = { version = "5.0", features = ["reqwest", "pkce-plain"] }

# Execution
bollard = { version = "0.16", features = ["hyper-rustls"] }
docker-api = { version = "0.5", features = ["tokio"] }

# Collaboration
yrs = { version = "0.21" }
yrs-awareness = "0.21"

# Rate limiting
governor = { version = "0.6" }

# Compression
flate2 = "1.0"
brotli = "4.0"

# Utils
clap = { version = "4.5", features = ["derive", "env"] }
once_cell = "1.19"
dashmap = "5.5"
parking_lot = "0.12"
async-channel = "2.3"
futures = "0.3"
pin-project = "1.1"
smallvec = "1.11"
bytes = "1.5"
http = "1.1"
hyper = { version = "1.4", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
urlencoding = "2"

[workspace.lints]
rust.unused_crate_dependencies = "warn"
rust.unused_imports = "warn"
rust.unused_variables = "warn"
rust.dead_code = "warn"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
opt-level = 3

[profile.dev]
debug = 2