version: '3.9'

services:
  # ========== 1. Backend All-in-One Container ==========
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.all-in-one
    image: trycode/backend:${TAG:-latest}
    container_name: trycode-backend
    environment:
      - CONFIG_FILE=/config/backend.toml
      - RUST_LOG=info,sqlx=warn,h2=warn,hyper=warn
      - VICTORIA_METRICS_URL=http://127.0.0.1:8428
      - VICTORIA_LOGS_URL=http://127.0.0.1:9428
      - VECTOR_CONFIG=/etc/vector/vector.toml
    volumes:
      - ./config/backend.toml:/config/backend.toml:ro
      - ./config/vector.toml:/etc/vector/vector.toml:ro
      - ./config/vm-scrape.yml:/etc/victoriametrics/scrape.yml:ro
      - ./data/backend:/data/backend:rw
      - ./data/vm:/data/vm:rw
      - ./data/vl:/data/vl:rw
      # Docker Secret mounts
      - /run/secrets/jwt_secret:/run/secrets/jwt_secret:ro
      - /run/secrets/pg_password:/run/secrets/pg_password:ro
      - /run/secrets/redis_password:/run/secrets/redis_password:ro
      - /run/secrets/smtp_password:/run/secrets/smtp_password:ro
      - /run/secrets/captcha_secret:/run/secrets/captcha_secret:ro
      - /run/secrets/ai_api_key:/run/secrets/ai_api_key:ro
      - /run/secrets/github_oauth_secret:/run/secrets/github_oauth_secret:ro
    networks:
      - external_1panel
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1.8G
        reservations:
          cpus: '1.0'
          memory: 1G
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    read_only: true
    tmpfs:
      - /tmp:size=200M,exec
      - /data:size=500M
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 15s

  # ========== 2-3. Execution Containers (1常驻 + 1按需) ==========
  exec-worker-1:
    build:
      context: ./executor
      dockerfile: Dockerfile
    image: trycode/executor:${TAG:-latest}
    container_name: trycode-exec-1
    environment:
      - WORKER_ID=1
      - METRICS_PORT=9090
      - RUST_LOG=info
    networks:
      - external_1panel
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    cap_add: [SYS_PTRACE]
    read_only: true
    tmpfs:
      - /workspace:size=400M,exec,uid=1000,gid=1000,mode=1777
      - /tmp:size=100M,exec,mode=1777
    restart: unless-stopped

  exec-worker-2:
    build:
      context: ./executor
      dockerfile: Dockerfile
    image: trycode/executor:${TAG:-latest}
    container_name: trycode-exec-2
    environment:
      - WORKER_ID=2
      - METRICS_PORT=9090
      - RUST_LOG=info
    networks:
      - external_1panel
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    cap_add: [SYS_PTRACE]
    read_only: true
    tmpfs:
      - /workspace:size=400M,exec,uid=1000,gid=1000,mode=1777
      - /tmp:size=100M,exec,mode=1777
    restart: unless-stopped
    profiles: ["scale"]

networks:
  external_1panel:
    name: 1panel-network
    external: true

volumes: {}