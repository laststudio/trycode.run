[package]
name = "executor-daemon"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "executor-daemon"
path = "src/main.rs"

[dependencies]
tokio = { version = "1.39", features = ["full"] }
clap = { version = "4.5", features = ["derive"] }
prometheus = "0.13"
prometheus-client = "0.44"
sysinfo = "0.30"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }